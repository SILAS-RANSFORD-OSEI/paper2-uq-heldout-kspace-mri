[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "paper2-uq-mri"
version = "0.1.0"
description = "Benchmarking model-derived uncertainty against held-out k-space residual risk."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "Silas Ransford Osei"}
]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "PyYAML>=6.0",
    "h5py>=3.10",
    "matplotlib>=3.8",
    "tqdm>=4.66",
    "torch>=2.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
